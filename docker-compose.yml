version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kpi-nukku-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      # Override DB to talk to containerized Postgres
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-kpi_nukku}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      REDIS_HOST: ${REDIS_HOST:-redis}
    depends_on:
      - db

  nginx:
    image: nginx:1.25-alpine
    container_name: kpi-nukku-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
      setup:
        condition: service_completed_successfully

  db:
    image: postgres:15-alpine
    container_name: kpi-nukku-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kpi_nukku}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kpi-nukku-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # One-off service to install PHP deps, migrate/seed, and cache configs
  setup:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kpi-nukku-setup
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-kpi_nukku}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      REDIS_HOST: ${REDIS_HOST:-redis}
    depends_on:
      - db
    command: >
      sh -lc "
      composer install --no-interaction --prefer-dist --optimize-autoloader &&
      php artisan key:generate --force || true &&
      # Ensure storage symlink and write perms for uploads
      php artisan storage:link || true &&
      chown -R www-data:www-data storage bootstrap/cache public/storage || true &&
      chmod -R ug+rwX storage bootstrap/cache public/storage || true &&
      # Run DB migrations and seeds
      php artisan migrate --force &&
      php artisan db:seed --force &&
      # Ensure Dompdf fonts available
      php artisan fonts:copy || true &&
      # Cache config/routes/views
      php artisan config:cache && php artisan route:cache && php artisan view:cache
      "
    restart: "no"

  # One-off service to build frontend assets with Vite
  node:
    image: node:20-alpine
    container_name: kpi-nukku-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -lc "npm ci && npm run build"
    depends_on:
      - app

volumes:
  dbdata:
  vendor:
